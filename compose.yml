services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: wallet
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: ${DB_PASSWORD:-wallet}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    ports:
      - "127.0.0.1:${API_PORT:-8081}:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/wallet
      DB_USERNAME: wallet
      DB_PASSWORD: ${DB_PASSWORD:-wallet}
      SPRING_PROFILES_ACTIVE: demo
      AUTHORIZATION_URL: ${AUTHORIZATION_URL:-https://util.devi.tools/api/v2/authorize}
      NOTIFICATION_URL: ${NOTIFICATION_URL:-https://util.devi.tools/api/v1/notify}
      NOTIFICATION_MAX_ATTEMPTS: ${NOTIFICATION_MAX_ATTEMPTS:-5}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-data:
