services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: wallet
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: ${DB_PASSWORD:-wallet}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    ports:
      - "127.0.0.1:${API_PORT:-8081}:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/wallet
      DB_USERNAME: wallet
      DB_PASSWORD: ${DB_PASSWORD:-wallet}
      SPRING_PROFILES_ACTIVE: demo
      # Segredo apenas para a demonstração local. Em qualquer outro ambiente, defina JWT_SECRET.
      JWT_SECRET: ${JWT_SECRET:-local-demo-secret-do-not-use-in-production}
      JWT_TTL: ${JWT_TTL:-15m}
      # Assistente de IA. Padrão: Ollama rodando no computador (host), sem custo.
      # O Ollama do host precisa aceitar conexões do Docker: OLLAMA_HOST=0.0.0.0 ollama serve.
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      # Só para AI_PROVIDER=anthropic (Claude, cobrado por token).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AUTHORIZATION_URL: ${AUTHORIZATION_URL:-https://util.devi.tools/api/v2/authorize}
      NOTIFICATION_URL: ${NOTIFICATION_URL:-https://util.devi.tools/api/v1/notify}
      NOTIFICATION_MAX_ATTEMPTS: ${NOTIFICATION_MAX_ATTEMPTS:-5}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-data:
